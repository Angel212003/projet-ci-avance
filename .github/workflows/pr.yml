name: Create Pull Request

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          branch: develop
          base: main
          title: "Synchronisation develop vers main"
          body: "Pull request générée automatiquement via GitHub Actions."
          commit-message: "Mise à jour automatique pour main"
          labels: "auto-pr"
          assignees: "Angel212003"
